server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/ml → ml-server so the browser avoids CORS entirely
    location /api/ml/ {
        proxy_pass         http://ml-server:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    # Proxy /api/bc0 → blockchain-node-0
    location /api/bc0/ {
        proxy_pass         http://blockchain-node-0:5000/;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_buffering    off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}